<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Remote Pay Guide Dashboard</title>
</head>
<body>
  <h1>Remote Pay Guide Dashboard</h1>

  <section>
    <h2>Content Overview</h2>
    <div id="overview"></div>
  </section>

  <section>
    <h2>System Health</h2>
    <div id="health"></div>
  </section>

  <section>
    <h2>Content List</h2>
    <div id="list"></div>
  </section>

<script>
fetch('./data/dashboard_data.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('overview').textContent =
      `Total Videos: ${data.total_videos}`;

    document.getElementById('health').textContent =
      `System Status: ${data.system_health.system_status} | Checks: ${JSON.stringify(data.system_health.checks)}`;

    document.getElementById('list').innerHTML = data.videos.map(v => `
      <div>
        <strong>${v.content_id}</strong><br>
        Topic: ${v.topic}<br>
        Generator: ${v.generator}<br>
        Production: ${v.production_status}<br>
        Publish Status: ${v.publish_status}<br>
        Platforms: ${v.platforms}<br>
        Published URL: ${v.published_url}<br>
        Lifecycle: ${v.lifecycle.current_state}<br>
        Analytics Status: ${v.analytics_status}<br>
        Analytics Platform: ${v.analytics.platform}<br>
        Views: ${v.analytics.views}<br>
        Clicks: ${v.analytics.clicks}<br>
        Likes: ${v.analytics.likes}<br>
        Shares: ${v.analytics.shares}<br>
        Conversion: ${v.analytics.conversion}
      </div>
      <hr>
    `).join('');
  });
</script>
</body>
</html>
