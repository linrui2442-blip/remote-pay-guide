<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Remote Pay Guide OS Console</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <h1>Remote Pay Guide OS Console</h1>

  <section class="card-grid">
    <div class="card">Total Content<br><strong id="total">0</strong></div>
    <div class="card">Published<br><strong>Read Only</strong></div>
    <div class="card">Production<br><strong>Lifecycle</strong></div>
    <div class="card">System Health<br><strong>Diagnostics</strong></div>
  </section>

  <section class="panel">
    <h2>Lifecycle Board</h2>
    <div id="lifecycle">Lifecycle states from dashboard data</div>
  </section>

  <section class="panel">
    <h2>Content Table</h2>
    <table>
      <thead>
        <tr>
          <th>content_id</th>
          <th>topic</th>
          <th>production_status</th>
          <th>publish_status</th>
          <th>lifecycle</th>
        </tr>
      </thead>
      <tbody id="content-table"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Analytics Panel</h2>
    <div id="analytics-panel"></div>
  </section>

  <section class="panel">
    <h2>Health Panel</h2>
    <div id="health-panel"></div>
  </section>

  <script src="./assets/dashboard.js"></script>
</body>
</html>
