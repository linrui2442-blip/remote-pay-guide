name: OS Account Analytics Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/backend/analytics/account_manager.py'
      - 'os/backend/analytics/models.py'
      - 'os/backend/analytics/youtube_api.py'
      - 'os/backend/analytics/collector.py'
      - 'os/backend/analytics/publish_bridge.py'
      - 'os/backend/routers/analytics.py'
      - 'os/backend/tests/r13_account_analytics_smoke.py'
      - '.github/workflows/os-account-analytics-verification.yml'

jobs:
  verify-account-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r os/backend/requirements.txt

      - name: Compile backend
        run: PYTHONPATH=os/backend python -m compileall -q os/backend

      - name: Verify account analytics collection and storage
        run: python os/backend/tests/r13_account_analytics_smoke.py
