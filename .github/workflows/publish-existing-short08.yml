name: Publish existing short08 through Postiz

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Render short02-short10 batch run ID containing the artifact'
        required: true
        type: string
      schedule_at:
        description: 'Optional ISO 8601 time with timezone; blank = randomized audience-window scheduling'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish-short08:
    needs: publish-short08
    runs-on: [self-hosted, windows, x64]
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_BASE_URL: http://localhost:4007/api/public/v1
      SHORT08_MEDIA_URL: https://linrui2442-blip.github.io/remote-pay-guide/media/short08.mp4
    steps:
      - name: Download publish inputs only
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path publish-tools,publish-input\short08 | Out-Null
          $raw='https://raw.githubusercontent.com/linrui2442-blip/remote-pay-guide/main'
          Invoke-WebRequest "$raw/video-factory/postiz_publish.py" -OutFile publish-tools\postiz_publish.py
          Invoke-WebRequest "$raw/content/posting-pack-01.md" -OutFile publish-tools\posting-pack-01.md
          Invoke-WebRequest "$raw/media/short08.json" -OutFile publish-input\short08\metadata.json
      - name: Publish short08 through Postiz
        shell: powershell
        run: |
          $publishArgs = @('publish-tools\postiz_publish.py', '--content-id', 'short08', '--artifact-root', 'publish-input', '--posting-pack', 'publish-tools\posting-pack-01.md', '--media-url', $env:SHORT08_MEDIA_URL)
          $schedule = '${{ inputs.schedule_at }}'
          if (-not [string]::IsNullOrWhiteSpace($schedule)) {
            $publishArgs += @('--schedule-at', $schedule)
          }
          python @publishArgs
