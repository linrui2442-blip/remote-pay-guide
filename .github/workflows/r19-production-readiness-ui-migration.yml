name: R19 Production Readiness UI Migration

on:
  push:
    paths:
      - '.github/workflows/r19-production-readiness-ui-migration.yml'

permissions:
  contents: write

jobs:
  migrate-production-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Production Center readiness UI
        run: python scripts/r19_production_readiness_ui_migration.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build

      - name: Verify Production Center readiness UI
        run: |
          ! grep -q 'workflow: "render.yml"' os/frontend/src/App.jsx
          grep -q 'githubWorkflow' os/frontend/src/App.jsx
          grep -q 'taskRunBlocker' os/frontend/src/App.jsx
          grep -q '不会回退到本地 GPU / 本地模型' os/frontend/src/App.jsx
          grep -q 'render-launch02.yml' os/frontend/src/App.jsx

      - name: Commit migration and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r19-production-readiness-ui-migration.yml
          git rm scripts/r19_production_readiness_ui_migration.py
          git add os/frontend/src/App.jsx
          git commit -m 'Surface Production execution readiness in UI'
          git push origin HEAD:main
