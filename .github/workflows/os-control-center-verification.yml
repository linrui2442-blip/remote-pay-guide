name: OS Control Center Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/backend/main.py'
      - 'os/backend/accounts/**'
      - 'os/backend/ai/**'
      - 'os/backend/analytics/**'
      - 'os/backend/assets/**'
      - 'os/backend/config/network.py'
      - 'os/backend/config/ai_gateway.py'
      - 'os/backend/production/**'
      - 'os/backend/publish/**'
      - 'os/backend/routers/accounts.py'
      - 'os/backend/routers/ai.py'
      - 'os/backend/routers/analytics.py'
      - 'os/backend/routers/assets.py'
      - 'os/backend/routers/oauth.py'
      - 'os/backend/routers/production.py'
      - 'os/backend/routers/publish.py'
      - 'os/backend/routers/settings.py'
      - 'os/backend/tests/r17_production_execution_contract_smoke.py'
      - 'os/backend/tests/r18_ai_gateway_async_lifecycle_smoke.py'
      - '.github/workflows/os-control-center-verification.yml'

jobs:
  verify-control-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure isolated test database
        shell: bash
        run: |
          echo "OS_TESTING=1" >> "$GITHUB_ENV"
          echo "OS_DATABASE_PATH=${RUNNER_TEMP}/remote-pay-guide-${GITHUB_JOB}.db" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r os/backend/requirements.txt

      - name: Compile backend
        run: PYTHONPATH=os/backend python -m compileall -q os/backend

      - name: Verify production execution contract
        run: python os/backend/tests/r17_production_execution_contract_smoke.py

      - name: Verify async AI Gateway lifecycle
        run: python os/backend/tests/r18_ai_gateway_async_lifecycle_smoke.py

      - name: Verify control center routes and local CORS
        env:
          PYTHONPATH: os/backend
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          import accounts.manager as accounts_manager
          import oauth.manager as oauth_manager
          import config.ai_gateway as ai_gateway_config
          import config.network as network_config
          from accounts.models import Account

          with tempfile.TemporaryDirectory() as tmpdir:
              db_path = str(Path(tmpdir) / 'os.db')
              accounts_manager.DB_PATH = db_path
              oauth_manager.DB_PATH = db_path
              network_config.DB_PATH = db_path
              ai_gateway_config.DB_PATH = Path(db_path)

              import main

              route_paths = set(main.app.openapi()['paths'])
              assert '/accounts' in route_paths
              assert '/accounts/{account_id}' in route_paths
              assert '/accounts/{account_id}/sync' in route_paths
              assert '/ai/request' in route_paths
              assert '/ai/status' in route_paths
              assert '/assets' in route_paths
              assert '/assets/video/{video_id}' in route_paths
              assert '/assets/{asset_id}' in route_paths
              assert '/production/status' in route_paths
              assert '/production/providers' in route_paths
              assert '/production/tasks' in route_paths
              assert '/production/tasks/{task_id}/readiness' in route_paths
              assert '/production/tasks/{task_id}/refresh' in route_paths
              assert '/publish/tasks' in route_paths
              assert '/publish/tasks/{task_id}' in route_paths
              assert '/publish/platforms' in route_paths
              assert '/analytics/metrics/current' in route_paths
              assert '/analytics/collector/collect/publish-task/{task_id}' in route_paths
              assert '/oauth/youtube/status' in route_paths
              assert '/oauth/youtube/authorize/{account_id}' in route_paths
              assert '/oauth/youtube/exchange' in route_paths
              assert '/settings/network/proxy' in route_paths
              assert '/settings/ai-gateway' in route_paths

              middleware_names = {
                  middleware.cls.__name__ for middleware in main.app.user_middleware
              }
              assert 'CORSMiddleware' in middleware_names
              assert 'http://localhost:5173' in main.frontend_origins
              assert 'http://127.0.0.1:5173' in main.frontend_origins

              created = accounts_manager.create_account(
                  Account(platform='youtube', account_name='verification-account')
              )
              assert created['platform'] == 'youtube'
              assert created['account_name'] == 'verification-account'
              assert accounts_manager.get_account(created['id'])['id'] == created['id']
              assert len(accounts_manager.get_accounts()) == 1

              saved = network_config.save_proxy_settings(
                  mode='manual',
                  proxy_url='127.0.0.1:7890',
              )
              assert saved['mode'] == 'manual'
              assert saved['proxy_url'] == 'http://127.0.0.1:7890'
              assert os.environ['HTTPS_PROXY'] == 'http://127.0.0.1:7890'
              assert network_config.get_proxy_status()['runtime_configured'] is True

              disabled = network_config.save_proxy_settings(mode='disabled')
              assert disabled['mode'] == 'disabled'
              assert network_config.get_proxy_status()['runtime_configured'] is False

              ai_saved = ai_gateway_config.save_ai_gateway_settings(
                  'https://relay.example.test/v1/video'
              )
              assert ai_saved['configured'] is True
              assert ai_saved['source'] == 'os_settings'
              assert ai_saved['local_inference'] is False

          print('control center verification passed')
          PY
