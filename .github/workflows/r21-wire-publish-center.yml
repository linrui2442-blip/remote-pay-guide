name: R21 Wire Publish Center UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/r21-wire-publish-center.yml'

permissions:
  contents: write

jobs:
  wire-publish-center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire PublishCenter component into App
        run: python scripts/r21_wire_publish_center.py

      - name: Commit App wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add os/frontend/src/App.jsx
          git commit -m 'Wire guarded Publish Center UI into OS'
          git push origin HEAD:main
