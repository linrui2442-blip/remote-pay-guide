name: Publish existing short04 through Postiz

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Render short02-short10 batch run ID containing the artifact'
        required: true
        default: '33723359599'
        type: string
      schedule_at:
        description: 'Optional ISO 8601 schedule time with timezone; blank = 20 minutes after publish job starts'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prepare-short04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download existing rendered batch in GitHub cloud
        uses: actions/download-artifact@v4
        with:
          name: remote-pay-guide-short02-short10
          path: source-batch
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Stage short04 as public GitHub Pages media
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path('source-batch/short04')
          metadata_path = source / 'metadata.json'
          if not metadata_path.exists():
              raise SystemExit(f'Missing {metadata_path}')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          if metadata.get('content_id') != 'short04':
              raise SystemExit('short04 metadata content_id mismatch')
          if metadata.get('status') != 'succeeded':
              raise SystemExit(f"short04 metadata status is {metadata.get('status')!r}, expected succeeded")
          output = metadata.get('output')
          if not output:
              raise SystemExit('short04 metadata has no output field')
          video = source / str(output)
          if not video.exists() or video.stat().st_size <= 0:
              raise SystemExit(f'Missing or empty short04 video: {video}')

          media_dir = Path('media')
          media_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(video, media_dir / 'short04.mp4')
          shutil.copy2(metadata_path, media_dir / 'short04.json')
          print(f'Staged public short04 media: {video.stat().st_size} bytes')
          PY

      - name: Commit staged media to main for GitHub Pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/short04.mp4 media/short04.json
          if git diff --cached --quiet; then
            echo 'short04 public media is already staged on main.'
          else
            git commit -m 'Stage short04 public media for Postiz'
            git push origin HEAD:main
          fi

      - name: Wait for GitHub Pages media URL
        shell: bash
        run: |
          url='https://linrui2442-blip.github.io/remote-pay-guide/media/short04.mp4'
          for attempt in $(seq 1 36); do
            if curl -fsSI --max-time 15 "$url" > pages-headers.txt; then
              echo "GitHub Pages media is reachable: $url"
              grep -iE '^(content-type|content-length|etag|last-modified):' pages-headers.txt || true
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/36)..."
            sleep 5
          done
          echo "GitHub Pages media did not become reachable: $url"
          exit 1

  publish-short04:
    needs: prepare-short04
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    concurrency:
      group: remote-pay-guide-short04-postiz
      cancel-in-progress: false
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_BASE_URL: http://localhost:4007/api/public/v1
      SHORT04_MEDIA_URL: https://linrui2442-blip.github.io/remote-pay-guide/media/short04.mp4

    steps:
      - name: Validate Postiz secret and local Python
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POSTIZ_API_KEY)) {
            throw 'Missing repository secret: POSTIZ_API_KEY'
          }

          $found = $false
          try {
            $version = & python --version 2>&1
            if ($LASTEXITCODE -eq 0 -and "$version" -match '^Python 3\.') {
              Add-Content -Path $env:GITHUB_ENV -Value 'PYTHON_EXE=python'
              Add-Content -Path $env:GITHUB_ENV -Value 'PYTHON_PREFIX='
              Write-Host "Using local $version via python"
              $found = $true
            }
          } catch {}

          if (-not $found) {
            try {
              $version = & py -3 --version 2>&1
              if ($LASTEXITCODE -eq 0 -and "$version" -match '^Python 3\.') {
                Add-Content -Path $env:GITHUB_ENV -Value 'PYTHON_EXE=py'
                Add-Content -Path $env:GITHUB_ENV -Value 'PYTHON_PREFIX=-3'
                Write-Host "Using local $version via py -3"
                $found = $true
              }
            } catch {}
          }

          if (-not $found) {
            throw 'Python 3 is not installed or not available on PATH on this self-hosted runner.'
          }

      - name: Download tiny publish inputs only
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Remove-Item -Recurse -Force 'publish-tools','publish-input' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'publish-tools' | Out-Null
          New-Item -ItemType Directory -Force -Path 'publish-input\short04' | Out-Null
          $raw = 'https://raw.githubusercontent.com/linrui2442-blip/remote-pay-guide/main'
          Invoke-WebRequest -UseBasicParsing -Uri "$raw/video-factory/postiz_publish.py" -OutFile 'publish-tools\postiz_publish.py'
          Invoke-WebRequest -UseBasicParsing -Uri "$raw/content/posting-pack-01.md" -OutFile 'publish-tools\posting-pack-01.md'
          Invoke-WebRequest -UseBasicParsing -Uri "$raw/media/short04.json" -OutFile 'publish-input\short04\metadata.json'
          Write-Host 'Downloaded script, posting metadata, and render metadata only. No video was downloaded to this runner.'

      - name: Ensure publish bridge dependency
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $prefix = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PYTHON_PREFIX)) { $prefix += $env:PYTHON_PREFIX }
          & $env:PYTHON_EXE @prefix -c "import requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Installing requests once for the local runner user...'
            & $env:PYTHON_EXE @prefix -m pip install --disable-pip-version-check --user requests
            if ($LASTEXITCODE -ne 0) { throw 'Could not install requests for local Python' }
          } else {
            Write-Host 'requests is already available.'
          }

      - name: Publish or schedule short04 through local Postiz
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $pythonArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PYTHON_PREFIX)) { $pythonArgs += $env:PYTHON_PREFIX }
          $pythonArgs += @(
            'publish-tools/postiz_publish.py',
            '--content-id', 'short04',
            '--artifact-root', 'publish-input',
            '--posting-pack', 'publish-tools/posting-pack-01.md',
            '--media-url', $env:SHORT04_MEDIA_URL
          )
          $schedule = '${{ inputs.schedule_at }}'
          if (-not [string]::IsNullOrWhiteSpace($schedule)) {
            $pythonArgs += @('--schedule-at', $schedule)
          }
          & $env:PYTHON_EXE @pythonArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove local temporary publish inputs
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Remove-Item -Recurse -Force 'publish-tools','publish-input' -ErrorAction SilentlyContinue
          Write-Host 'Removed temporary publish inputs. No video was stored on this runner.'
