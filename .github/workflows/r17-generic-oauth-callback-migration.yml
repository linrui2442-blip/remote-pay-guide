name: R17 Generic OAuth Callback Migration

on:
  push:
    paths:
      - '.github/workflows/r17-generic-oauth-callback-migration.yml'

permissions:
  contents: write

jobs:
  migrate-callback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update App callback routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('os/frontend/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old_import = 'import YouTubeOAuthCallback from "./pages/YouTubeOAuthCallback.jsx";'
          new_import = 'import PlatformOAuthCallback from "./pages/PlatformOAuthCallback.jsx";'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected one callback import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'  if \(window\.location\.pathname === "/oauth/youtube/callback"\) \{\n'
              r'\s+return <YouTubeOAuthCallback />;\n'
              r'  \}'
          )
          replacement = (
              '  const oauthCallbackMatch = window.location.pathname.match(/^\\/oauth\\/([^/]+)\\/callback\\/?$/i);\n'
              '  if (oauthCallbackMatch) {\n'
              '    return (\n'
              '      <PlatformOAuthCallback\n'
              '        platform={decodeURIComponent(oauthCallbackMatch[1]).toLowerCase()}\n'
              '      />\n'
              '    );\n'
              '  }'
          )
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one callback route, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build

      - name: Verify generic callback routing
        run: |
          grep -q 'PlatformOAuthCallback' os/frontend/src/App.jsx
          grep -q 'oauthCallbackMatch' os/frontend/src/App.jsx
          ! grep -q 'import YouTubeOAuthCallback' os/frontend/src/App.jsx
          grep -q 'exchangePlatformOAuth' os/frontend/src/pages/PlatformOAuthCallback.jsx

      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r17-generic-oauth-callback-migration.yml
          git add os/frontend/src/App.jsx
          git commit -m 'Route OAuth callbacks through platform runtime'
          git push origin HEAD:main
