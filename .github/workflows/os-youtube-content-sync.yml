name: OS YouTube Content Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'os/backend/config/network.py'
      - 'os/backend/integrations/google_transport.py'
      - 'os/backend/integrations/youtube.py'
      - 'os/backend/analytics/models.py'
      - 'os/backend/analytics/manager.py'
      - 'os/backend/analytics/youtube_api.py'
      - 'os/backend/analytics/collector.py'
      - 'os/backend/analytics/publish_bridge.py'
      - 'os/backend/data/tracking.py'
      - 'os/backend/data/query.py'
      - 'os/backend/data/manager.py'
      - 'os/backend/routers/accounts.py'
      - 'os/backend/routers/analytics.py'
      - 'os/backend/routers/data.py'
      - 'os/backend/assets/**'
      - 'os/backend/publish/**'
      - 'os/backend/tests/r5_youtube_content_sync_smoke.py'
      - 'os/backend/tests/r6_account_analytics_sync_smoke.py'
      - 'os/backend/tests/r7_active_tracking_policy_smoke.py'
      - 'os/backend/tests/r8_data_query_layer_smoke.py'
      - '.github/workflows/os-youtube-content-sync.yml'

jobs:
  verify-youtube-content-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure isolated test database
        shell: bash
        run: |
          echo "OS_TESTING=1" >> "$GITHUB_ENV"
          echo "OS_DATABASE_PATH=${RUNNER_TEMP}/remote-pay-guide-${GITHUB_JOB}.db" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r os/backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q os/backend

      - name: Run YouTube content sync smoke test
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r5_youtube_content_sync_smoke.py

      - name: Run account Analytics sync smoke test
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r6_account_analytics_sync_smoke.py

      - name: Run active tracking policy smoke test
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r7_active_tracking_policy_smoke.py

      - name: Run Data Center query layer smoke test
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r8_data_query_layer_smoke.py
