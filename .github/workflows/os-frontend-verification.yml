name: OS Frontend Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/frontend/**'
      - '.github/workflows/os-frontend-verification.yml'

jobs:
  verify-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build

      - name: Verify provider-neutral platform account UI
        run: |
          ! grep -q 'PLATFORM_CONNECTORS' os/frontend/src/App.jsx
          ! grep -q 'beginYouTubeOAuth' os/frontend/src/App.jsx
          ! grep -q 'platform === "youtube"' os/frontend/src/App.jsx
          grep -q 'beginPlatformOAuth' os/frontend/src/App.jsx
          grep -q 'syncAccountAll' os/frontend/src/App.jsx
          grep -q 'account_connector_registered' os/frontend/src/App.jsx
