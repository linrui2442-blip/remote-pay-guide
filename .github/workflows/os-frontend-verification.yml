name: OS Frontend Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/frontend/**'
      - '.github/workflows/os-frontend-verification.yml'

jobs:
  verify-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build

      - name: Verify provider-neutral platform account UI
        run: |
          ! grep -q 'PLATFORM_CONNECTORS' os/frontend/src/App.jsx
          ! grep -q 'beginYouTubeOAuth' os/frontend/src/App.jsx
          ! grep -q 'platform === "youtube"' os/frontend/src/App.jsx
          grep -q 'beginPlatformOAuth' os/frontend/src/App.jsx
          grep -q 'syncAccountAll' os/frontend/src/App.jsx
          grep -q 'account_connector_registered' os/frontend/src/App.jsx
          grep -q 'PlatformOAuthCallback' os/frontend/src/App.jsx
          grep -q 'oauthCallbackMatch' os/frontend/src/App.jsx

      - name: Verify Production execution readiness UI
        run: |
          ! grep -q 'workflow: "render.yml"' os/frontend/src/App.jsx
          grep -q 'githubWorkflow' os/frontend/src/App.jsx
          grep -q 'taskRunBlocker' os/frontend/src/App.jsx
          grep -q 'render-launch02.yml' os/frontend/src/App.jsx
          grep -q '不会回退到本地 GPU / 本地模型' os/frontend/src/App.jsx

      - name: Verify AI Gateway settings UI
        run: |
          grep -q 'getAIGatewaySettings' os/frontend/src/api.js
          grep -q 'saveAIGatewaySettings' os/frontend/src/api.js
          grep -q 'AI REMOTE PRODUCTION' os/frontend/src/App.jsx
          grep -q '本地推理：禁用' os/frontend/src/App.jsx
          grep -q 'API Key 只允许通过后端进程环境提供' os/frontend/src/App.jsx
          ! grep -q 'setAIGatewayApiKey' os/frontend/src/App.jsx

      - name: Verify Data Center Intelligence controls
        run: |
          grep -q 'AI INTELLIGENCE' os/frontend/src/pages/DataCenter.jsx
          grep -q '/intelligence/feedback/account/' os/frontend/src/pages/DataCenter.jsx
          grep -q '/materialize' os/frontend/src/pages/DataCenter.jsx
          grep -q '创建下一轮生产任务' os/frontend/src/pages/DataCenter.jsx
          grep -q '不会自动运行或发布' os/frontend/src/pages/DataCenter.jsx
          grep -q 'item.operation === "intelligence_feedback"' os/frontend/src/App.jsx
          grep -q 'Intelligence 新策略' os/frontend/src/App.jsx
