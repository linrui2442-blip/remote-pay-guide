name: OS Frontend Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/frontend/**'
      - '.github/workflows/os-frontend-verification.yml'

jobs:
  verify-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build
