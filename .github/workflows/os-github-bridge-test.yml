name: OS GitHub Completion Bridge Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/os-github-bridge-test.yml'

jobs:
  dispatch-through-os-provider:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bridge test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests pydantic google-auth google-api-python-client

      - name: Prepare isolated OS database directory
        run: mkdir -p os/database

      - name: Execute canonical ProductionTask to online asset smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: os/backend
        run: python os/backend/tests/r2_github_bridge_smoke.py

  produce-safe-test-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create tiny valid MP4 fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = ""
          target = Path('os-bridge-test.mp4')
          target.write_bytes(base64.b64decode(data))
          if target.stat().st_size < 1000:
              raise SystemExit('MP4 fixture unexpectedly small')
          print(f'Created {target} ({target.stat().st_size} bytes)')
          PY

      - name: Upload safe test artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-bridge-test-${{ github.run_id }}
          path: os-bridge-test.mp4
          if-no-files-found: error
          retention-days: 1
