name: Publish existing short09 through Postiz

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Render batch run ID
        required: true
        type: string
      schedule_at:
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prepare-short09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: remote-pay-guide-short02-short10
          path: source-batch
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Stage short09 media
        run: |
          set -e
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          cid='short09'
          src=Path('source-batch')/cid
          meta=src/'metadata.json'
          assert meta.exists()
          data=json.loads(meta.read_text())
          assert data.get('content_id')==cid
          video=src/data['output']
          assert video.exists()
          Path('media').mkdir(exist_ok=True)
          shutil.copy2(video,'media/short09.mp4')
          shutil.copy2(meta,'media/short09.json')
          PY
          test -f media/short09.mp4
          test -f media/short09.json
      - name: Commit media
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f media/short09.mp4 media/short09.json
          git diff --cached --quiet && exit 1
          git commit -m 'Stage short09 public media for Postiz'
          git push origin HEAD:main
      - name: Wait for GitHub Pages media URL
        run: |
          set -e
          curl -fsSI https://linrui2442-blip.github.io/remote-pay-guide/media/short09.mp4

  publish-short09:
    needs: prepare-short09
    runs-on: [self-hosted, windows, x64]
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_BASE_URL: http://localhost:4007/api/public/v1
      SHORT09_MEDIA_URL: https://linrui2442-blip.github.io/remote-pay-guide/media/short09.mp4
    steps:
      - name: Download publish inputs
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path publish-tools,publish-input\short09 | Out-Null
          $raw='https://raw.githubusercontent.com/linrui2442-blip/remote-pay-guide/main'
          Invoke-WebRequest "$raw/video-factory/postiz_publish.py" -OutFile publish-tools\postiz_publish.py
          Invoke-WebRequest "$raw/content/posting-pack-01.md" -OutFile publish-tools\posting-pack-01.md
          Invoke-WebRequest "$raw/media/short09.json" -OutFile publish-input\short09\metadata.json
          if(!(Test-Path publish-input\short09\metadata.json)){exit 1}
      - name: Publish short09
        shell: powershell
        run: |
          python publish-tools\postiz_publish.py --content-id short09 --artifact-root publish-input --posting-pack publish-tools\posting-pack-01.md --media-url $env:SHORT09_MEDIA_URL
