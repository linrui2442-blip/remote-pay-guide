name: OS Data Center Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/backend/data/**'
      - 'os/backend/analytics/**'
      - 'os/backend/intelligence/**'
      - 'os/backend/oauth/**'
      - 'os/backend/production/**'
      - 'os/backend/routers/data.py'
      - 'os/backend/routers/analytics.py'
      - 'os/backend/routers/oauth.py'
      - 'os/backend/tests/r7_active_tracking_policy_smoke.py'
      - 'os/backend/tests/r8_data_query_layer_smoke.py'
      - 'os/backend/tests/r9_archive_tracking_policy_smoke.py'
      - 'os/backend/tests/r19_data_center_contract_smoke.py'
      - 'os/backend/tests/r21_data_query_v2_time_range_smoke.py'
      - '.github/workflows/os-data-center-verification.yml'

jobs:
  verify-data-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure isolated test database
        shell: bash
        run: |
          echo "OS_TESTING=1" >> "$GITHUB_ENV"
          echo "OS_DATABASE_PATH=${RUNNER_TEMP}/remote-pay-guide-${GITHUB_JOB}.db" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r os/backend/requirements.txt

      - name: Compile backend
        run: PYTHONPATH=os/backend python -m compileall -q os/backend

      - name: Verify Data Center contract
        env:
          YOUTUBE_OAUTH_CLIENT_ID: verify-client
          YOUTUBE_OAUTH_CLIENT_SECRET: verify-secret
        run: python os/backend/tests/r19_data_center_contract_smoke.py

      - name: Verify active tracking policy
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r7_active_tracking_policy_smoke.py

      - name: Verify Data Center query layer
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r8_data_query_layer_smoke.py

      - name: Verify Data Center Query V2 time range contract
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r21_data_query_v2_time_range_smoke.py

      - name: Verify archive tracking policy
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r9_archive_tracking_policy_smoke.py
