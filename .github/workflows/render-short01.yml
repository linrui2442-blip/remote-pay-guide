name: Render short01 proof

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Task manifest under video-factory/'
        required: false
        default: 'tasks-short01.jsonl'
        type: string
      content_id:
        description: 'Canonical content id for the polish step'
        required: false
        default: 'short01'
        type: string
      hook:
        description: 'Hook text for the polish step'
        required: false
        default: 'Can I pay you in USDT?'
        type: string
      artifact_name:
        description: 'Artifact name'
        required: false
        default: 'short01-proof'
        type: string
      task_payload_b64:
        description: 'Base64 encoded single MPT task payload'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPT_COMMIT: cbbb366393105d5cefc254dc9ed492d43da0711b
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4

      - name: Validate Pexels secret
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Missing repository secret: PEXELS_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and FFmpeg
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Fetch pinned MoneyPrinterTurbo
        shell: bash
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          git checkout "$MPT_COMMIT"

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: uv sync --frozen

      - name: Configure Pexels without exposing the key
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('config.toml')
          text = path.read_text(encoding='utf-8')
          key = os.environ['PEXELS_API_KEY']
          replacement = 'pexels_api_keys = [' + json.dumps(key) + ']'
          if 'pexels_api_keys = []' not in text:
              raise SystemExit('Could not find pexels_api_keys placeholder in config.toml')
          text = text.replace('pexels_api_keys = []', replacement, 1)
          text = text.replace('log_level = "DEBUG"', 'log_level = "INFO"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Select render task manifest
        shell: bash
        env:
          TASK_FILE: ${{ inputs.task_file }}
          TASK_PAYLOAD_B64: ${{ inputs.task_payload_b64 }}
        run: |
          if [ -n "$TASK_PAYLOAD_B64" ]; then python - <<'PY'
          import base64, json, os
          task = json.loads(base64.b64decode(os.environ['TASK_PAYLOAD_B64']).decode('utf-8'))
          if not isinstance(task, dict): raise SystemExit('task payload must be object')
          with open('MoneyPrinterTurbo/tasks-selected.jsonl','w',encoding='utf-8') as f:
              f.write(json.dumps(task, ensure_ascii=False) + '\n')
          PY
          else cp "video-factory/${TASK_FILE}" MoneyPrinterTurbo/tasks-selected.jsonl; fi

      - name: Render short01
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -o pipefail
          uv run python cli.py --batch-file ./tasks-selected.jsonl --stop-at video | tee ../render-result.json

      - name: Polish hook and CTA
        shell: bash
        env:
          HOOK_TEXT: ${{ inputs.hook }}
          CONTENT_ID: ${{ inputs.content_id }}
        run: |
          FINAL_VIDEO="$(find MoneyPrinterTurbo/storage/tasks -type f -name 'final-1.mp4' | head -n 1)"
          if [ -z "$FINAL_VIDEO" ]; then
            echo "Could not find rendered final-1.mp4"
            exit 1
          fi
          uv run --project MoneyPrinterTurbo python video-factory/polish_short.py \
            --input "$FINAL_VIDEO" \
            --output "$(dirname "$FINAL_VIDEO")/polished-${CONTENT_ID}.mp4" \
            --font MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf \
            --hook "$HOOK_TEXT"

      - name: Collect render files
        if: always()
        shell: bash
        run: |
          mkdir -p render-artifacts
          POLISHED_VIDEO="$(find MoneyPrinterTurbo/storage/tasks -type f -name 'polished-${{ inputs.content_id }}.mp4' | head -n 1)"
          if [ -n "$POLISHED_VIDEO" ]; then
            cp "$POLISHED_VIDEO" render-artifacts/final-output.mp4
          fi
          if [ -f render-result.json ]; then
            cp render-result.json render-artifacts/
          fi
          if [ -d MoneyPrinterTurbo/storage/tasks ]; then
            find MoneyPrinterTurbo/storage/tasks -type f \
              \( -name '*.mp4' -o -name '*.srt' -o -name '*.json' -o -name '*.mp3' \) \
              -exec cp --parents {} render-artifacts/ \;
          fi

      - name: Upload short01 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: render-artifacts/
          if-no-files-found: warn
          retention-days: 7
