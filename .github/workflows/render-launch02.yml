name: Render short02-short10 batch

on:
  workflow_dispatch:
    inputs:
      publish_short04:
        description: 'After rendering, publish/schedule short04 through local Postiz'
        required: false
        default: false
        type: boolean
      schedule_at:
        description: 'Optional ISO 8601 schedule time with timezone; blank = 20 minutes after publish job starts'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  render-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPT_COMMIT: cbbb366393105d5cefc254dc9ed492d43da0711b
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4

      - name: Validate Pexels secret
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Missing repository secret: PEXELS_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and FFmpeg
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Fetch pinned MoneyPrinterTurbo
        shell: bash
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          git checkout "$MPT_COMMIT"

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: uv sync --frozen

      - name: Configure Pexels without exposing the key
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('config.toml')
          text = path.read_text(encoding='utf-8')
          key = os.environ['PEXELS_API_KEY']
          replacement = 'pexels_api_keys = [' + json.dumps(key) + ']'
          if 'pexels_api_keys = []' not in text:
              raise SystemExit('Could not find pexels_api_keys placeholder in config.toml')
          text = text.replace('pexels_api_keys = []', replacement, 1)
          text = text.replace('log_level = "DEBUG"', 'log_level = "INFO"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Render and polish short02-short10
        shell: bash
        run: |
          python video-factory/render_batch.py \
            --mpt-root MoneyPrinterTurbo \
            --tasks video-factory/tasks-launch02.jsonl \
            --meta video-factory/launch02-meta.json \
            --output batch-output \
            --polisher video-factory/polish_short.py \
            --font MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-pay-guide-short02-short10
          path: batch-output/
          if-no-files-found: warn
          retention-days: 7

  publish-short04:
    if: ${{ inputs.publish_short04 }}
    needs: render-batch
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    concurrency:
      group: remote-pay-guide-short04-postiz
      cancel-in-progress: false
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_BASE_URL: http://localhost:4007/api/public/v1

    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4

      - name: Validate Postiz secret
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POSTIZ_API_KEY)) {
            throw 'Missing repository secret: POSTIZ_API_KEY'
          }

      - name: Download rendered batch
        uses: actions/download-artifact@v4
        with:
          name: remote-pay-guide-short02-short10
          path: batch-output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install publish bridge dependency
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: python -m pip install --disable-pip-version-check requests

      - name: Publish or schedule short04 through local Postiz
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $argsList = @(
            'video-factory/postiz_publish.py',
            '--content-id', 'short04',
            '--artifact-root', 'batch-output',
            '--posting-pack', 'content/posting-pack-01.md'
          )
          $schedule = '${{ inputs.schedule_at }}'
          if (-not [string]::IsNullOrWhiteSpace($schedule)) {
            $argsList += @('--schedule-at', $schedule)
          }
          python @argsList

      - name: Copy publish state into workflow artifact
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Force -Path publish-output | Out-Null
          $state = Join-Path $env:LOCALAPPDATA 'RemotePayGuide\publish-state\short04.json'
          if (Test-Path $state) {
            Copy-Item $state 'publish-output\short04.json' -Force
          } else {
            Write-Host 'No publish state file was created.'
          }

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-pay-guide-short04-publish-result
          path: publish-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove downloaded media from self-hosted runner
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path 'batch-output') {
            Remove-Item -Recurse -Force 'batch-output'
            Write-Host 'Removed batch-output from self-hosted runner.'
          } else {
            Write-Host 'No batch-output directory to remove.'
          }
