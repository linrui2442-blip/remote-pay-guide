name: Render short02-short10 batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPT_COMMIT: cbbb366393105d5cefc254dc9ed492d43da0711b
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout Remote Pay Guide
        uses: actions/checkout@v4

      - name: Validate Pexels secret
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Missing repository secret: PEXELS_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and FFmpeg
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Fetch pinned MoneyPrinterTurbo
        shell: bash
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          git checkout "$MPT_COMMIT"

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: uv sync --frozen

      - name: Configure Pexels without exposing the key
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('config.toml')
          text = path.read_text(encoding='utf-8')
          key = os.environ['PEXELS_API_KEY']
          replacement = 'pexels_api_keys = [' + json.dumps(key) + ']'
          if 'pexels_api_keys = []' not in text:
              raise SystemExit('Could not find pexels_api_keys placeholder in config.toml')
          text = text.replace('pexels_api_keys = []', replacement, 1)
          text = text.replace('log_level = "DEBUG"', 'log_level = "INFO"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Render and polish short02-short10
        shell: bash
        run: |
          python video-factory/render_batch.py \
            --mpt-root MoneyPrinterTurbo \
            --tasks video-factory/tasks-launch02.jsonl \
            --meta video-factory/launch02-meta.json \
            --output batch-output \
            --polisher video-factory/polish_short.py \
            --font MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-pay-guide-short02-short10
          path: batch-output/
          if-no-files-found: warn
          retention-days: 7
