name: Test publish scheduling

on:
  push:
    branches: [main]
    paths:
      - 'video-factory/postiz_publish.py'
      - 'tests/test_postiz_schedule.py'
      - '.github/workflows/test-publish-scheduling.yml'
  pull_request:
    paths:
      - 'video-factory/postiz_publish.py'
      - 'tests/test_postiz_schedule.py'
      - '.github/workflows/test-publish-scheduling.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m unittest discover -s tests -v
