name: R21 Production Async UI Migration

on:
  push:
    paths:
      - 'scripts/r21_production_async_ui_migration.py'
      - '.github/workflows/r21-production-async-ui-migration.yml'

permissions:
  contents: write

jobs:
  migrate-production-async-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Production async controls
        run: python scripts/r21_production_async_ui_migration.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: os/frontend
        run: npm install

      - name: Build frontend
        working-directory: os/frontend
        run: npm run build

      - name: Verify Production async controls
        run: |
          grep -q 'refreshProductionTask' os/frontend/src/App.jsx
          grep -q 'taskCanRefresh' os/frontend/src/App.jsx
          grep -q '刷新状态' os/frontend/src/App.jsx
          grep -q '等待远程结果' os/frontend/src/App.jsx

      - name: Commit migration and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r21-production-async-ui-migration.yml scripts/r21_production_async_ui_migration.py
          git add os/frontend/src/App.jsx
          git commit -m 'Surface async Production status refresh in UI'
          git push origin HEAD:main
