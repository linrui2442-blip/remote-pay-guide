name: OS Platform Registry Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'os/backend/publish/**'
      - 'os/backend/data/platform_capabilities.py'
      - 'os/backend/tests/r4_platform_registry_smoke.py'
      - 'os/backend/tests/r36_instagram_reels_adapter_smoke.py'
      - 'os/backend/tests/r37_instagram_reels_graph_contract_smoke.py'
      - 'os/backend/tests/r20_publish_center_execution_contract_smoke.py'
      - 'os/backend/tests/r38_instagram_publish_center_integration_smoke.py'
      - '.github/workflows/os-platform-registry-verification.yml'

jobs:
  verify-platform-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure isolated test database
        shell: bash
        run: |
          echo "OS_TESTING=1" >> "$GITHUB_ENV"
          echo "OS_DATABASE_PATH=${RUNNER_TEMP}/remote-pay-guide-${GITHUB_JOB}.db" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r os/backend/requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile backend
        run: PYTHONPATH=os/backend python -m compileall -q os/backend

      - name: Verify dynamic platform registry
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r4_platform_registry_smoke.py

      - name: Verify Instagram adapter tests
        env:
          PYTHONPATH: os/backend
        run: python -m pytest os/backend/tests/r36_instagram_reels_adapter_smoke.py

      - name: Verify Instagram Graph tests
        env:
          PYTHONPATH: os/backend
        run: python -m pytest os/backend/tests/r37_instagram_reels_graph_contract_smoke.py

      - name: Verify Instagram Publish Center integration
        env:
          PYTHONPATH: os/backend
        run: python -m pytest os/backend/tests/r38_instagram_publish_center_integration_smoke.py

      - name: Verify Publish Center execution contract
        env:
          PYTHONPATH: os/backend
        run: python os/backend/tests/r20_publish_center_execution_contract_smoke.py
